[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[[redirects]]
  from = "/api/wildfires"
  to = "/.netlify/functions/wildfires"
  status = 200

[[redirects]]
  from = "/api/ai/summary"
  to = "/.netlify/functions/ai-summary"
  status = 200

[[redirects]]
  from = "/api/overpass"
  to = "/.netlify/functions/overpass"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
